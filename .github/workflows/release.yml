name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Test and build
        run: |
          npm run test
          npm run build

      - name: Test Rust
        working-directory: src-tauri
        run: cargo test

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'A+助手 __VERSION__'
          releaseBody: |
            Windows 桌面股票/基金小组件 v__VERSION__。

            安装包：APlus_Assistant___VERSION___x64-setup.exe（NSIS 安装程序）

            完整更新说明见提交历史与 README。
          releaseDraft: false
          prerelease: false

      # Action 环境下中文 productName 会变成乱码资产名，统一重命名为 APlus_Assistant_ 版本_x64-setup.exe
      - name: Normalize release asset names
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download $env:TAG --repo $env:REPO --dir artifacts --clobber
          Get-ChildItem artifacts | ForEach-Object {
            if ($_.Name -match '(\d+\.\d+\.\d+)_x64-setup\.exe$' -and $_.Name -notlike 'APlus_Assistant_*') {
              Rename-Item $_.FullName ("APlus_Assistant_{0}_x64-setup.exe" -f $Matches[1]) -Force
            } elseif ($_.Name -notlike '*_x64-setup.exe') {
              Remove-Item $_.FullName -Force
            }
          }
          $oldAssets = (gh release view $env:TAG --repo $env:REPO --json assets --jq '.assets[].name') -split "`n"
          foreach ($asset in $oldAssets) {
            if ($asset -and $asset -notlike 'APlus_Assistant_*_x64-setup.exe') {
              gh release delete-asset $env:TAG $asset --repo $env:REPO --yes
            }
          }
          gh release upload $env:TAG artifacts/*_x64-setup.exe --repo $env:REPO --clobber
